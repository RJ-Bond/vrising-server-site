name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend (import check + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.3.2
      - name: Import check (backend/*.py)
        run: bash scripts/check_backend.sh
      - name: pytest (backend/tests)
        run: bash scripts/test_backend.sh

  frontend:
    name: Frontend (HTML/CSS validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate frontend/*.html + CSS
        run: bash scripts/check.sh

  # Every push to master that passes both jobs above gets an automatic semver tag
  # (vMAJOR.MINOR.PATCH, PATCH auto-incremented — see "Compute next version" below
  # for why) + a GitHub Release whose notes are the emoji-annotated commit list since
  # the previous tag (see scripts/release_notes.sh). Deploy itself stays manual
  # (`sudo js` on the server, per CLAUDE.md) — this job only marks/documents releases,
  # it never touches the server. Skipped on pull_request (no new commits on master yet
  # to release) and on the VERSION-bump commit itself, via the standard "[skip ci]"
  # convention below.
  #
  # Started at v0.1.0, replacing the original vYYYY.MM.DD calendar-versioning scheme —
  # semver is what most people expect a "version" to look like. The last CalVer tag is
  # deliberately never matched as a "previous" version to increment from (see the
  # single-digit-major glob below), since e.g. "v2026.07.23" parsed as MAJOR.MINOR.PATCH
  # would produce a nonsense v2026.07.24 next version.
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Paused at the maintainer's request (2026-07-30), after the VERSION-file incident
    # this feature's first real day caused (install.sh's own update path stomping the
    # same file CI commits to, blocking `git pull` on the server). Re-enable by
    # restoring the commented-out condition below once asked to.
    # if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    if: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          # PATCH auto-increments on every release; MAJOR/MINOR are a human decision
          # (edit VERSION + tag by hand whenever a release actually deserves one) — this
          # repo ships many small commits a day with no Conventional-Commits typing to
          # reliably infer a bigger bump from, so PATCH-per-release is the only auto-bump
          # that's honest without a person deciding. The glob requires a single-digit
          # MAJOR so old vYYYY.MM.DD calendar tags (4-digit "major") never match here.
          last_tag=$(git tag -l 'v[0-9].[0-9]*.[0-9]*' | sort -V | tail -1)
          if [ -z "$last_tag" ]; then
            new_version="v0.1.0"
          else
            IFS='.' read -r major minor patch <<< "${last_tag#v}"
            new_version="v${major}.${minor}.$((patch + 1))"
          fi
          prev_tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          echo "version=$new_version" >> "$GITHUB_OUTPUT"
          echo "prev_tag=$prev_tag" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          notes="$(bash scripts/release_notes.sh "${{ steps.version.outputs.prev_tag }}")"
          {
            echo "notes<<EOF_NOTES"
            echo "$notes"
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"

      - name: Bump VERSION and commit
        run: |
          echo "${{ steps.version.outputs.version }}" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump VERSION to ${{ steps.version.outputs.version }} [skip ci]"
          git push origin HEAD:master

      - name: Tag release
        run: |
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "🚀 Релиз ${{ steps.version.outputs.version }}"
          body: ${{ steps.changelog.outputs.notes }}
