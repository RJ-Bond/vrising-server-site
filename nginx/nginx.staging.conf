worker_processes auto;

events {
    worker_connections 1024;
}

# Staging variant of nginx.conf (see docker-compose.staging.yml) — identical except the
# `/analytics/` -> vrising_umami proxy block is removed entirely, since the staging stack
# deliberately doesn't run Umami/Postgres (see docker-compose.staging.yml's header
# comment). nginx resolves static (non-variable) proxy_pass hostnames once at worker
# startup — pointing at a hostname that doesn't exist in the staging network would risk
# breaking worker startup entirely, not just that one location, so the block is dropped
# here rather than left in and simply unused. Keep this in sync with nginx.conf for
# everything else (add_header/location changes there should be mirrored here too).
http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml font/woff2;

    server_tokens off;

    client_max_body_size 12m;

    map $http_user_agent $is_crawler_ua {
        default 0;
        "~*(bot|crawler|spider|slurp|facebookexternalhit|discordbot|telegrambot|twitterbot|whatsapp|slackbot|linkedinbot|vkshare|pinterest|redditbot|applebot|skypeuripreview|w3c_validator)" 1;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;
        error_page 503 /maintenance.html;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://rutube.ru; frame-ancestors 'none';" always;

        location ~* \.(js|css|woff2?|ttf|otf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location ~* \.(png|jpg|jpeg|gif|webp|ico|svg)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location = /sitemap.xml {
            proxy_pass http://vrising_api:8000/api/sitemap.xml;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Content-Type "application/xml; charset=utf-8";
        }

        location = /rss.xml {
            proxy_pass http://vrising_api:8000/api/rss.xml;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Content-Type "application/rss+xml; charset=utf-8";
        }

        location = /maintenance.html { try_files $uri =404; }
        location = /admin.html       { try_files $uri =404; }
        location = /login.html       { try_files $uri =404; }

        location ~* \.html$ {
            if (-f /var/maintenance/.flag) {
                return 503;
            }
            try_files $uri =404;
        }

        location = / {
            if (-f /var/maintenance/.flag) {
                return 503;
            }
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            set $prerender "";
            if ($is_crawler_ua) { set $prerender "1"; }
            if ($arg_news = "") { set $prerender ""; }
            if ($prerender) {
                proxy_pass http://vrising_api:8000/api/news-embed?slug=$arg_news;
            }
            try_files /index.html =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ^~ /api/ {
            proxy_pass http://vrising_api:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding on;
        }

    }
}
