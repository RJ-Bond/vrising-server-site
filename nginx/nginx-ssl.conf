worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml font/woff2;

    # Hide nginx version
    server_tokens off;

    # nginx's own default is 1m — well under backend/routers/admin_system.py's declared
    # _MAX_UPLOAD_BYTES (10 MB). Anything between the two got silently 413'd by nginx
    # itself before ever reaching FastAPI, and the admin panel's upload handlers (which
    # just do `await res.json()` on the response) choked on nginx's HTML error page with
    # "Unexpected token '<' ... is not valid JSON" instead of a real error message.
    client_max_body_size 12m;

    # Crawlers/link-unfurlers that don't execute JS (Discord, Telegram, VK, Twitter,
    # search bots, …) never run index.js's client-side setMeta() call, so a shared
    # article link (/?news=<slug>) always showed the generic homepage title/image.
    # Requests from these user-agents for that specific shape get routed (see the "/"
    # location below) to /api/news-embed, which re-serves index.html with the real
    # article's meta swapped in server-side; regular browsers are unaffected.
    map $http_user_agent $is_crawler_ua {
        default 0;
        "~*(bot|crawler|spider|slurp|facebookexternalhit|discordbot|telegrambot|twitterbot|whatsapp|slackbot|linkedinbot|vkshare|pinterest|redditbot|applebot|skypeuripreview|w3c_validator)" 1;
    }

    # HTTP → HTTPS redirect + certbot challenge
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/letsencrypt/live/v.just-skill.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/v.just-skill.ru/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/v.just-skill.ru/chain.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_stapling        on;
        ssl_stapling_verify on;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # connect-src 'self' — if frontend/common.js's SENTRY_DSN constant is ever
        # filled in, the vendored SDK (frontend/sentry.min.js) will POST error reports
        # to that project's ingest domain (e.g. https://o0.ingest.sentry.io or a
        # self-hosted host), which needs adding here too or the browser will silently
        # block every report. Left out for now since the real domain depends on which
        # Sentry project/org gets created — don't guess it, and don't widen this to
        # connect-src * to "solve" it, that defeats the point of the CSP.
        # Umami is different: its tracker (frontend/common.js's UMAMI_WEBSITE_ID
        # block) is proxied through this same nginx at /analytics/ (see the
        # `location ^~ /analytics/` block below and docker-compose.yml's `umami`
        # service), so both the script fetch (script-src 'self') and its beacon
        # POSTs (connect-src 'self') are already same-origin — no CSP change needed
        # here unless that proxy path setup ever changes to a different origin.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://rutube.ru; frame-ancestors 'none';" always;

        root /usr/share/nginx/html;
        index index.html;
        error_page 503 /maintenance.html;
        error_page 404 /404.html;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Long-term cache for hashed/versioned static assets
        location ~* \.(js|css|woff2?|ttf|otf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Medium cache for images
        location ~* \.(png|jpg|jpeg|gif|webp|ico|svg)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # SEO: sitemap served from API (dynamic, includes news URLs)
        location = /sitemap.xml {
            proxy_pass http://vrising_api:8000/api/sitemap.xml;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            add_header Content-Type "application/xml; charset=utf-8";
        }

        # RSS feed served from API
        location = /rss.xml {
            proxy_pass http://vrising_api:8000/api/rss.xml;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            add_header Content-Type "application/rss+xml; charset=utf-8";
        }

        # Pages always accessible regardless of maintenance mode
        location = /maintenance.html { try_files $uri =404; }
        location = /admin.html       { try_files $uri =404; }
        location = /login.html       { try_files $uri =404; }

        # Maintenance mode: return 503 for all other HTML pages when flag file exists
        location ~* \.html$ {
            if (-f /var/maintenance/.flag) {
                return 503;
            }
            try_files $uri =404;
        }

        # Root — check maintenance flag, then bot-only article prerender
        location = / {
            if (-f /var/maintenance/.flag) {
                return 503;
            }
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            set $prerender "";
            if ($is_crawler_ua) { set $prerender "1"; }
            if ($arg_news = "") { set $prerender ""; }
            if ($prerender) {
                proxy_pass http://vrising_api:8000/api/news-embed?slug=$arg_news;
            }
            try_files /index.html =404;
        }

        # This is a multi-page site, not a client-routed SPA, so an unmatched path here
        # is a genuine dead link — falling back to /index.html (old behavior) served the
        # homepage with a 200 for literally any nonexistent path (e.g. /12), which is
        # wrong for both users (silently wrong page, no "not found" signal) and crawlers
        # (indexes garbage URLs as if they were real content). error_page 404 above sends
        # real 404s to the dedicated frontend/404.html page instead.
        location / {
            try_files $uri $uri/ =404;
        }

        # Umami analytics dashboard + tracker, reverse-proxied at the same origin
        # instead of a subdomain — no extra DNS record or certbot cert needed, just
        # this location block (see docker-compose.yml's `umami` service, which sets
        # BASE_PATH=/analytics so the app's own routes already match this prefix
        # 1:1 — no rewrite here). ^~ for the same reason as /api/ below: without it,
        # the regex asset-cache location above would intercept e.g. /analytics/script.js.
        location ^~ /analytics/ {
            proxy_pass http://vrising_umami:3000/analytics/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ^~ tells nginx to stop checking regex locations (like the image-cache block
        # above) once this prefix matches — without it, /api/uploads/*.png|gif|etc.
        # got intercepted by that regex location instead of being proxied, since nginx
        # always prefers a matching regex location over a plain prefix location.
        location ^~ /api/ {
            proxy_pass http://vrising_api:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            # Required for SSE (Server-Sent Events) streaming
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding on;
        }

    }
}
